name: Build amd64

on:
  workflow_dispatch:
  push:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: windows
            goarch: amd64
            suffix: .exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          SUFFIX="${{ matrix.suffix }}"
          VERSION="${GITHUB_SHA::7}"
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "vaydns-client-${{ matrix.goos }}-${{ matrix.goarch }}${SUFFIX}" ./vaydns-client
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "vaydns-server-${{ matrix.goos }}-${{ matrix.goarch }}${SUFFIX}" ./vaydns-server

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vaydns-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            vaydns-client-*
            vaydns-server-*
          retention-days: 90
